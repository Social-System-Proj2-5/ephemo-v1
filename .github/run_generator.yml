name: Generate Ephemera

on:
  push:
    paths:
      - 'prompt.txt' # prompt.txt が更新された時だけ実行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 画像をリポジトリに書き込むために必要

    steps:
    - name: クローンリポジトリ
      uses: actions/checkout@v4

    - name: Pythonのセットアップ
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: ライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 画像生成スクリプトの実行
      env:
        OPENAI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # SecretからAPIキーを注入
      run: python generate_ephemera.py

    - name: 生成された画像をリポジトリに自動コミット
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add output_ephemera_*.png
        git diff --cached --quiet || git commit -m "🤖 AIがエフェメラを生成しました [skip ci]"
        git push